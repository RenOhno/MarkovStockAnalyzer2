spring.application.name=markov-stock-analyzer2
server.port=8080
server.address=${APP_BIND_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/markov_stock_analyzer?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:msa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.python-api-base-url=${PYTHON_API_BASE_URL:http://localhost:8000}
app.internal-api-token=${INTERNAL_API_TOKEN:}
app.market-calendar-version=${MARKET_CALENDAR_VERSION:4.13.2}
