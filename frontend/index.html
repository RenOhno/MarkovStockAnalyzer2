<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markov Stock Analyzer 2</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Markov Stock Analyzer 2</h1>
  <p>マルコフ連鎖を用いた株価の上昇・下落傾向分析（ゼミ研究の検証ツール）</p>
</header>
<main>
  <section>
    <h2>分析条件</h2>
    <form id="analysis-form">
      <label>銘柄コード
        <input type="text" id="ticker" value="7203.T" required>
      </label>
      <label>開始日
        <input type="date" id="start" required>
      </label>
      <label>終了日（この日は含まない）
        <input type="date" id="end" required>
      </label>
      <label>閾値 θ（%）
        <input type="number" id="theta" value="0.5" step="0.1" min="0.1" required>
      </label>
      <button type="submit">分析する</button>
    </form>
    <p id="message" class="message"></p>
  </section>
  <section>
    <h2>分析結果</h2>
    <div id="result">
      <p>まだ分析していません。「分析する」を押すと、状態分類と遷移行列が表示されます。</p>
    </div>
  </section>
  <section>
    <h2>保存済みの分析</h2>
    <ul id="saved-list"></ul>
  </section>
  <section>
    <h2>このツールについて</h2>
    <p>マルコフ連鎖の理論（最尤推定・定常分布・収束）が、実際の株価データでどこまで成り立つかを検証するためのツールです。銘柄の推奨や売買シグナルの提示は行いません。状態は日次リターンを閾値θで U（上昇）/ F（横ばい）/ D（下落）に分類したものです。</p>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
