name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build with Maven
        working-directory: backend
        run: mvn -B -DskipTests package

  analysis:
    name: Analysis tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.2"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run pytest
        run: uv run --frozen pytest -q

  compose:
    name: Docker Compose build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env with dummy CI secrets
        run: |
          cat > .env <<'EOF'
          MYSQL_DATABASE=markov_stock_analyzer
          MYSQL_USER=msa
          MYSQL_PASSWORD=ci-dummy-password
          MYSQL_ROOT_PASSWORD=ci-dummy-root-password
          INTERNAL_API_TOKEN=ci-dummy-token
          BACKEND_PORT=8080
          MARKET_CALENDAR_VERSION=4.13.2
          EOF
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker compose ps --format json backend | python3 -c "import sys, json; print(json.load(sys.stdin).get('Health', ''))" 2>/dev/null || true)
            echo "attempt $i: backend health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 10
          done
          echo "Backend did not become healthy in time"
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Smoke test HTTP response
        run: curl --fail --silent http://127.0.0.1:8080/ | grep -q "Markov Stock Analyzer 2"
      - name: Stop stack
        if: always()
        run: docker compose down -v
